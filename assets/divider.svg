<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" preserveAspectRatio="none" role="presentation">
<defs><linearGradient id="p"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".5" stop-color="#d8ffe4"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></linearGradient></defs>
<style>.s{animation:s 5s linear infinite}@keyframes s{from{transform:translateX(-320px)}to{transform:translateX(1200px)}}@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:0}}</style>
