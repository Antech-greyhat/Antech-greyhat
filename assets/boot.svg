<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 287" width="900" height="287" role="img" aria-label="Boot sequence: every service reports OK, ending with an ASCII art skull">
<title>Boot sequence</title>
<defs><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:Consolas,"DejaVu Sans Mono","Liberation Mono","Courier New",monospace;font-weight:700;font-size:18px;fill:#b6ffcb}.ok{fill:#00ff41}.sk{fill:#00ff41;font-size:18px}.p{fill:#00ff41}.c{fill:#00ff41;animation:b 1.1s steps(1) infinite}.a{animation:a .01s steps(1) both}@keyframes a{from{opacity:0}}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.a,.c{animation:none}}</style>
