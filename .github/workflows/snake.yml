name: Generate Snake

on:
  schedule: # 03:30 Nairobi (EAT) == 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00a32a&color_dots=#ebedf0,#9be9a8,#40c463,#00a32a,#006b2e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#003b1f,#006b2e,#00b33c,#00ff41

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
