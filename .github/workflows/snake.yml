name: Generate Snake

on:
  schedule: # 03:30 Nairobi (EAT) == 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c2410c&color_dots=#ebedf0,#ffe08a,#ffc233,#e09600,#a86b00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5f1f&color_dots=#161b22,#4d3300,#8a5c00,#cc8800,#ffb000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
